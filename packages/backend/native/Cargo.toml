[package]
name = "vickey-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "2.16"
napi-derive = "2.16"
unicode-normalization = "0.1"
rstar = "0.12"
geo = "0.29"
lazy_static = "1.4"
ego-tree = "0.6"
image = { version = "0.24", default-features = false, features = ["png"] }
rand = "0.8"
sha2 = "0.10"
scraper = "0.18"
regex = "1.10"
url = "2.5"

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
