name: api.json validation

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - .github/workflows/validate-api-json.yml
  pull_request:
    paths:
      - packages/backend/**
      - .github/workflows/validate-api-json.yml

jobs:
  validate-api-json:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4.3.0
        with:
          submodules: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-setuptools
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
      - name: Use Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install Redocly CLI
        run: npm i -g @redocly/cli
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - name: Rebuild native modules
        run: pnpm rebuild
      - name: Check pnpm-lock.yaml
        run: git diff --exit-code pnpm-lock.yaml
      - name: Copy Configure
        run: cp .config/example.yml .config/default.yml
      - name: Build and generate
        run: pnpm build && pnpm --filter backend generate-api-json
      - name: Validation
        run: npx @redocly/cli lint --extends=minimal ./packages/backend/built/api.json
